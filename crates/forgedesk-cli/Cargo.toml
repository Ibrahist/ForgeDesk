[package]
name = "forgedesk-cli"
version = "0.1.0"
edition = "2021"
description = "Command-line tool and local bridge runner for ForgeDesk"

[dependencies]
forgedesk-core = { path = "../forgedesk-core" }
tokio = { version = "1.40", features = ["full"] }
tracing = "0.1"
tracing-subscriber = "0.3"
clap = { version = "4.5", features = ["derive"] }
