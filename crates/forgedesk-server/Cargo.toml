[package]
name = "forgedesk-server"
version = "0.1.0"
edition = "2021"
description = "Self-hosted rendezvous and relay server for ForgeDesk"

[dependencies]
forgedesk-core = { path = "../forgedesk-core" }
tokio = { version = "1.40", features = ["full"] }
tokio-tungstenite = "0.24"
futures-util = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = "0.3"
clap = { version = "4.5", features = ["derive"] }
uuid = { version = "1.10", features = ["v4"] }
rand = "0.8"
