[package]
name = "forgedesk-ffi"
version = "0.1.0"
edition = "2021"
description = "C-FFI bindings for ForgeDesk"

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
forgedesk-core = { path = "../forgedesk-core" }
tokio = { version = "1.40", features = ["full"] }
serde_json = "1.0"
lazy_static = "1.5"
